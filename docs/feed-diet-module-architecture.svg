<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">CattlePro feed, inventory-lot, diet-plan, and reporting architecture</title>
  <desc id="desc">Architecture showing web and mobile clients calling an authenticated idempotent API, domain services for procurement, inventory valuation, diet versioning, consumption and period close, immutable records, read models, audit events, and the safe backdate flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Arial, sans-serif; fill: #475569; }
      .lane { font: 700 15px Inter, Arial, sans-serif; fill: #334155; letter-spacing: 1.2px; }
      .node-title { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 400 14px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #475569; }
      .edge-label { font: 600 12px Inter, Arial, sans-serif; fill: #334155; }
      .box { stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#f8fafc"/>
  <text x="70" y="65" class="title">Feed &amp; Diet Module — Target Architecture</text>
  <text x="70" y="98" class="subtitle">Immutable quantity records • effective-dated ration versions • purchase-lot costing • safe backdating • reproducible monthly reports</text>

  <text x="40" y="163" class="lane" transform="rotate(-90 40 163)">CHANNELS</text>
  <rect x="70" y="125" width="330" height="92" fill="#dbeafe" stroke="#60a5fa" class="box"/>
  <text x="95" y="159" class="node-title">Web &amp; Mobile UI</text>
  <text x="95" y="184" class="node-text">Procurement • Ration builder • Backdate preview</text>
  <text x="95" y="204" class="node-text">Stock card • Monthly variance reports</text>

  <rect x="450" y="125" width="300" height="92" fill="#e0e7ff" stroke="#818cf8" class="box"/>
  <text x="475" y="159" class="node-title">Scheduler / Daily Close</text>
  <text x="475" y="184" class="node-text">Creates idempotent process requests</text>
  <text x="475" y="204" class="node-text">Never edits stock directly</text>

  <rect x="800" y="125" width="330" height="92" fill="#f3e8ff" stroke="#c084fc" class="box"/>
  <text x="825" y="159" class="node-title">Admin &amp; Finance</text>
  <text x="825" y="184" class="node-text">Period close • controlled correction</text>
  <text x="825" y="204" class="node-text">Revaluation approval • audit review</text>

  <rect x="1180" y="125" width="350" height="92" fill="#dcfce7" stroke="#4ade80" class="box"/>
  <text x="1205" y="159" class="node-title">Backend Jobs / Integrations</text>
  <text x="1205" y="184" class="node-text">Notifications • exports • accounting sync</text>
  <text x="1205" y="204" class="node-text">Consume committed outbox events</text>

  <path d="M235 217 V263" class="edge"/>
  <path d="M600 217 V263" class="edge"/>
  <path d="M965 217 V263" class="edge"/>
  <path d="M1355 217 V263" class="edge"/>

  <text x="40" y="330" class="lane" transform="rotate(-90 40 330)">API</text>
  <rect x="70" y="263" width="1460" height="112" fill="#ffffff" stroke="#94a3b8" class="box"/>
  <text x="100" y="299" class="node-title">CattlePro Feed API Gateway / Application Layer</text>
  <text x="100" y="328" class="node-text">Tenant + farm authorization</text>
  <text x="390" y="328" class="node-text">Role permissions</text>
  <text x="620" y="328" class="node-text">Idempotency keys</text>
  <text x="845" y="328" class="node-text">Request validation</text>
  <text x="1070" y="328" class="node-text">Period locks</text>
  <text x="1280" y="328" class="node-text">Optimistic concurrency</text>
  <text x="100" y="353" class="small">All commands execute in one database transaction and return the committed aggregate plus reconciliation identifiers.</text>

  <path d="M320 375 V430" class="edge-blue"/>
  <path d="M665 375 V430" class="edge-blue"/>
  <path d="M1000 375 V430" class="edge-blue"/>
  <path d="M1340 375 V430" class="edge-blue"/>

  <text x="40" y="520" class="lane" transform="rotate(-90 40 520)">DOMAIN SERVICES</text>
  <rect x="70" y="430" width="290" height="170" fill="#ecfeff" stroke="#22d3ee" class="box"/>
  <text x="95" y="466" class="node-title">Procurement Service</text>
  <text x="95" y="495" class="node-text">• Purchase preview / commit</text>
  <text x="95" y="520" class="node-text">• Correction / reversal</text>
  <text x="95" y="545" class="node-text">• Vendor payable + ledger</text>
  <text x="95" y="570" class="node-text">• Creates immutable stock lots</text>

  <rect x="395" y="430" width="300" height="170" fill="#ecfdf5" stroke="#34d399" class="box"/>
  <text x="420" y="466" class="node-title">Inventory &amp; Valuation</text>
  <text x="420" y="495" class="node-text">• Native + normalized quantities</text>
  <text x="420" y="520" class="node-text">• FEFO lot allocation</text>
  <text x="420" y="545" class="node-text">• As-of stock / valuation</text>
  <text x="420" y="570" class="node-text">• Replay + revaluation versions</text>

  <rect x="730" y="430" width="300" height="170" fill="#eef2ff" stroke="#818cf8" class="box"/>
  <text x="755" y="466" class="node-title">Diet Plan Service</text>
  <text x="755" y="495" class="node-text">• Effective-dated versions</text>
  <text x="755" y="520" class="node-text">• Assignment snapshots</text>
  <text x="755" y="545" class="node-text">• Quantity/unit validation</text>
  <text x="755" y="570" class="node-text">• Date-specific cost estimate</text>

  <rect x="1065" y="430" width="300" height="170" fill="#fff7ed" stroke="#fb923c" class="box"/>
  <text x="1090" y="466" class="node-title">Consumption Service</text>
  <text x="1090" y="495" class="node-text">• Preview / post / reverse</text>
  <text x="1090" y="520" class="node-text">• Historical stock validation</text>
  <text x="1090" y="545" class="node-text">• Cost + lot snapshots</text>
  <text x="1090" y="570" class="node-text">• Duplicate-safe daily close</text>

  <rect x="1400" y="430" width="130" height="170" fill="#fef2f2" stroke="#f87171" class="box"/>
  <text x="1420" y="466" class="node-title">Period</text>
  <text x="1420" y="490" class="node-title">Close</text>
  <text x="1420" y="525" class="node-text">Open</text>
  <text x="1420" y="548" class="node-text">Closed</text>
  <text x="1420" y="571" class="node-text">Adjust</text>

  <path d="M360 515 H395" class="edge"/>
  <path d="M695 515 H730" class="edge"/>
  <path d="M1030 515 H1065" class="edge"/>
  <path d="M1365 515 H1400" class="edge"/>

  <path d="M215 600 V675" class="edge"/>
  <path d="M545 600 V675" class="edge"/>
  <path d="M880 600 V675" class="edge"/>
  <path d="M1215 600 V675" class="edge"/>
  <path d="M1465 600 V675" class="edge"/>

  <text x="40" y="770" class="lane" transform="rotate(-90 40 770)">SYSTEM OF RECORD</text>
  <rect x="70" y="675" width="285" height="185" fill="#ffffff" stroke="#64748b" class="box"/>
  <text x="95" y="711" class="node-title">Purchase &amp; Stock Lots</text>
  <text x="95" y="740" class="node-text">FeedPurchase + lines</text>
  <text x="95" y="765" class="node-text">StockLot + batch/expiry</text>
  <text x="95" y="790" class="node-text">Exact purchase unit cost</text>
  <text x="95" y="815" class="node-text">Vendor payable references</text>
  <text x="95" y="840" class="small">Append-only lifecycle</text>

  <rect x="385" y="675" width="285" height="185" fill="#ffffff" stroke="#64748b" class="box"/>
  <text x="410" y="711" class="node-title">Inventory Ledger</text>
  <text x="410" y="740" class="node-text">Immutable IN / OUT events</text>
  <text x="410" y="765" class="node-text">Lot allocation versions</text>
  <text x="410" y="790" class="node-text">Reversal / supersession links</text>
  <text x="410" y="815" class="node-text">Effective + recorded time</text>
  <text x="410" y="840" class="small">Quantity truth lives here</text>

  <rect x="700" y="675" width="285" height="185" fill="#ffffff" stroke="#64748b" class="box"/>
  <text x="725" y="711" class="node-title">Ration Versions</text>
  <text x="725" y="740" class="node-text">DietPlanVersion + items</text>
  <text x="725" y="765" class="node-text">Effective date range</text>
  <text x="725" y="790" class="node-text">Target assignment snapshot</text>
  <text x="725" y="815" class="node-text">Normalized quantity rules</text>
  <text x="725" y="840" class="small">Never edit posted versions</text>

  <rect x="1015" y="675" width="285" height="185" fill="#ffffff" stroke="#64748b" class="box"/>
  <text x="1040" y="711" class="node-title">Consumption Postings</text>
  <text x="1040" y="740" class="node-text">Run + ingredient lines</text>
  <text x="1040" y="765" class="node-text">Animal head-day snapshot</text>
  <text x="1040" y="790" class="node-text">Unit-cost + lot snapshot</text>
  <text x="1040" y="815" class="node-text">Status / reversal chain</text>
  <text x="1040" y="840" class="small">Reproducible actual cost</text>

  <rect x="1330" y="675" width="200" height="185" fill="#ffffff" stroke="#64748b" class="box"/>
  <text x="1355" y="711" class="node-title">Governance</text>
  <text x="1355" y="740" class="node-text">AccountingPeriod</text>
  <text x="1355" y="765" class="node-text">AuditEvent</text>
  <text x="1355" y="790" class="node-text">RevaluationRun</text>
  <text x="1355" y="815" class="node-text">OutboxEvent</text>
  <text x="1355" y="840" class="small">Full traceability</text>

  <path d="M355 767 H385" class="edge"/>
  <path d="M670 767 H700" class="edge"/>
  <path d="M985 767 H1015" class="edge"/>
  <path d="M1300 767 H1330" class="edge"/>

  <text x="40" y="970" class="lane" transform="rotate(-90 40 970)">READ MODELS</text>
  <rect x="70" y="915" width="350" height="125" fill="#f0f9ff" stroke="#38bdf8" class="box"/>
  <text x="95" y="951" class="node-title">Stock Card &amp; As-of Inventory</text>
  <text x="95" y="980" class="node-text">Quantity, lot, expiry, value, reconciliation</text>
  <text x="95" y="1005" class="small">Rebuilt from committed ledger events</text>

  <rect x="455" y="915" width="330" height="125" fill="#f0fdf4" stroke="#4ade80" class="box"/>
  <text x="480" y="951" class="node-title">Monthly Procurement Rates</text>
  <text x="480" y="980" class="node-text">Weighted PKR/kg • min/max • purchase count</text>
  <text x="480" y="1005" class="small">Purchases only; chronological months</text>

  <rect x="820" y="915" width="330" height="125" fill="#faf5ff" stroke="#c084fc" class="box"/>
  <text x="845" y="951" class="node-title">Ration &amp; Usage Variance</text>
  <text x="845" y="980" class="node-text">Kg/head-day • price • usage • mix variance</text>
  <text x="845" y="1005" class="small">Uses effective date and posted snapshots</text>

  <rect x="1185" y="915" width="345" height="125" fill="#fff7ed" stroke="#fb923c" class="box"/>
  <text x="1210" y="951" class="node-title">Finance &amp; Feed COGS</text>
  <text x="1210" y="980" class="node-text">Purchase cash flow separate from consumption cost</text>
  <text x="1210" y="1005" class="small">Original, restated, and adjustment views</text>

  <path d="M528 860 V890 H245 V915" class="edge-dashed"/>
  <path d="M213 860 V890 H620 V915" class="edge-dashed"/>
  <path d="M843 860 V890 H985 V915" class="edge-dashed"/>
  <path d="M1158 860 V890 H1358 V915" class="edge-dashed"/>

  <rect x="70" y="1067" width="1460" height="34" rx="8" fill="#e2e8f0"/>
  <text x="800" y="1090" text-anchor="middle" class="edge-label">Backdated commands never overwrite history: open periods append valuation revisions; closed periods post a current-period adjustment.</text>
</svg>
